<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laptop Recommendation Dashboard</title>
    <style>
        
        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            color: #1d1d1f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
            text-align: center;
            backdrop-filter: blur(10px);
        }
        h2 { color: #1d1d1f; font-size: 28px; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px;}
        p.subtitle { color: #86868b; font-size: 15px; margin-bottom: 30px; }
        
        label { text-align: left; display: block; margin-top: 15px; font-weight: 600; font-size: 12px; color: #515154; text-transform: uppercase; letter-spacing: 0.5px;}
        input[type="number"], input[type="text"], select { 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 12px; 
            border: 1px solid #d2d2d7; 
            width: 100%; 
            box-sizing: border-box; 
            background: #ffffff; 
            color: #1d1d1f; 
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
        
        button { 
            padding: 16px 20px; 
            background: #0071e3; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            margin-top: 25px; 
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }
        button:hover { 
            background: #0077ed; 
            transform: scale(1.02); 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TechFinder Pro</h2>
        <p class="subtitle">Search, configure, and download quotes.</p>
        
        <form action="recommend" method="POST">
            <label>Maximum Budget (Rs.):</label>
            <input type="number" name="budget" placeholder="e.g. 150000" required>
            
            <label>Usage Category:</label>
            <select name="category">
                <option value="All">All Categories</option>
                <option value="Student">Student & Education</option>
                <option value="Business">Business & Corporate</option>
                <option value="Gaming">Gaming & Performance</option>
                <option value="Creator">Creator & Design</option>
            </select>

            <label>Sort Results By:</label>
            <select name="sort">
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>

            <label>Preferred Brand (Optional):</label>
            <input type="text" name="brand" placeholder="e.g. Apple, Dell">
            
            <button type="submit">Search Inventory</button>
        </form>
    </div>
</body>
</html>
